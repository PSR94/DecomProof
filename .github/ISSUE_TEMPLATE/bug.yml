name: Bug report
description: Report incorrect behavior, especially unsafe evidence/verdict behavior.
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What happened and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Include sanitized target, policy and evidence shape. Never include secrets.}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: DecomProof version}
