name: Documentation
on:
  pull_request:
    paths: ['**/*.md', 'assets/**', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['**/*.md', 'assets/**', '.github/workflows/docs.yml']
permissions: {contents: read}
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path .github/validation-marker.md './**/*.md'
          fail: true
