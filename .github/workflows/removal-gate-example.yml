name: DecomProof removal gate example
on:
  workflow_dispatch:
  pull_request:
    paths: ['examples/atlascommerce/**', 'crates/**']
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./packages/github-action
        id: decomproof
        with:
          target: service:legacy-export
          root: examples/atlascommerce/stages/stage-0
          evidence: examples/atlascommerce/stages/stage-0/runtime.jsonl
          fail-on: never
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: retirement-proof, path: '${{ steps.decomproof.outputs.proof-path }}'}
