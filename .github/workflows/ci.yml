name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {contents: read}
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  proof-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/demo.sh all
      - run: python -m pip install jsonschema
      - run: python scripts/validate-proof.py fixtures/golden/retirement.proof.json
      - run: python scripts/validate-proof.py retirement.proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: retirement-proof, path: retirement.proof.json, if-no-files-found: warn}
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - run: ruff check decomproof_api tests
      - run: pytest -q
  dashboard:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/dashboard}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run test
      - run: npm run build
  security-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check-no-secrets.py
