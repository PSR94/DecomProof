name: Release packaging
on:
  push:
    tags: ['v*']
permissions: {contents: write}
jobs:
  cli:
    strategy: {matrix: {include: [{os: ubuntu-latest, target: x86_64-unknown-linux-gnu}, {os: macos-latest, target: x86_64-apple-darwin}]}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: '${{ matrix.target }}'}
      - run: cargo build --release -p decomproof --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/decomproof dist/decomproof-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with: {name: 'decomproof-${{ matrix.target }}', path: dist/*}
