name: Temporary README asset transfer

on:
  push:
    branches: [main]
    paths:
      - '.readme-transfer/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct approved README images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/readme
          cat .readme-transfer/final-hero.*.b64 | base64 -d > docs/assets/readme/decomproof-hero.webp
          cat .readme-transfer/final-architecture.*.b64 | base64 -d > docs/assets/readme/decomproof-architecture.webp
          cat .readme-transfer/final-flow.*.b64 | base64 -d > docs/assets/readme/decomproof-flow.webp

      - name: Verify exact bytes and dimensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          expected = {
              Path('docs/assets/readme/decomproof-hero.webp'): ('6d09ad9c3ae2bbd6d2360649ac6dace3c6c83acd13f0a63098da8db71dc01138', (1500, 500)),
              Path('docs/assets/readme/decomproof-architecture.webp'): ('053de29f20d7a0a932810aa35e280b237d7b749af38e8765c23e5feb84522dd3', (1100, 619)),
              Path('docs/assets/readme/decomproof-flow.webp'): ('f276053745b5c91f26c3ef31590b51aee2a33fa949329571ae106bdd25c31a92', (1100, 619)),
          }

          for path, (want_sha, want_dims) in expected.items():
              data = path.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  dims = image.size
                  fmt = image.format
              assert fmt == 'WEBP', f'{path}: expected WEBP, got {fmt}'
              assert sha == want_sha, f'{path}: sha256 mismatch: {sha}'
              assert dims == want_dims, f'{path}: dimensions {dims} != {want_dims}'
              print(f'OK {path}: {dims[0]}x{dims[1]} sha256={sha}')
          PY

      - name: Update README image placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text()

          old_hero = '''<p align="center">\n  <img src="assets/hero.svg" alt="DecomProof: evidence-backed software decommissioning" width="920" />\n</p>'''
          new_hero = '''<p align="center">\n  <img src="docs/assets/readme/decomproof-hero.webp" alt="DecomProof — evidence-backed software decommissioning" width="100%" />\n</p>'''
          assert s.count(old_hero) == 1, 'expected exactly one old README hero block'
          s = s.replace(old_hero, new_hero, 1)

          old_flow = '<p align="center"><img src="assets/proof-flow.svg" alt="Evidence-linked proof flow" width="900" /></p>'
          new_flow = '''<p align="center">\n  <img src="docs/assets/readme/decomproof-flow.webp" alt="DecomProof retirement proof flow from target selection through post-removal verification" width="100%" />\n</p>'''
          assert s.count(old_flow) == 1, 'expected exactly one old proof-flow image'
          s = s.replace(old_flow, new_flow, 1)

          toc_old = '- [How the proof pipeline works](#how-the-proof-pipeline-works)\n- [Safety model](#safety-model)'
          toc_new = '- [How the proof pipeline works](#how-the-proof-pipeline-works)\n- [Architecture](#architecture)\n- [Safety model](#safety-model)'
          assert s.count(toc_old) == 1, 'expected pipeline/safety TOC anchor'
          s = s.replace(toc_old, toc_new, 1)

          arch_anchor = 'The Rust core owns target identity, evidence normalization, temporal logic, graph construction, policy evaluation, scoring, and proof generation. Network-facing systems are optional shells around that deterministic core.\n\n## Safety model'
          arch_section = '''## Architecture\n\n<p align="center">\n  <img src="docs/assets/readme/decomproof-architecture.webp" alt="DecomProof architecture showing interfaces, evidence inputs, deterministic core engine, API/dashboard, and outputs" width="100%" />\n</p>\n\nThe Rust core owns target identity, evidence normalization, temporal logic, graph construction, policy evaluation, scoring, and proof generation. Network-facing systems are optional shells around that deterministic core.\n\nFor detailed text diagrams and ADRs, see [`docs/architecture`](docs/architecture/).\n\n## Safety model'''
          assert s.count(arch_anchor) == 1, 'expected architecture insertion anchor'
          s = s.replace(arch_anchor, arch_section, 1)

          p.write_text(s)
          PY

      - name: Verify README references and remove obsolete README image versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path('README.md').read_text()
          required = [
              'docs/assets/readme/decomproof-hero.webp',
              'docs/assets/readme/decomproof-architecture.webp',
              'docs/assets/readme/decomproof-flow.webp',
          ]
          for ref in required:
              assert ref in s, f'missing README reference: {ref}'
              assert Path(ref).is_file(), f'missing asset: {ref}'
          assert 'assets/hero.svg' not in s
          assert 'assets/proof-flow.svg' not in s
          first_block = s.split('</p>', 1)[0]
          assert 'docs/assets/readme/decomproof-hero.webp' in first_block
          assert 'width="100%"' in first_block
          assert 'height=' not in first_block
          assert s.lstrip().startswith('<p align="center">')
          print('README references verified')
          PY
          git rm -f assets/hero.svg assets/banner.svg assets/proof-flow.svg assets/proof-flow-compact.svg

      - name: Remove all transfer files and commit clean content state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .readme-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md docs/assets/readme assets .readme-transfer
          git diff --cached --check
          git status --short
          git commit -m 'docs: use approved README visuals'
          git push origin HEAD:main
