name: Temporary README asset transfer

on:
  push:
    branches: [main]
    paths:
      - '.readme-transfer/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct approved README images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets/readme
          cat .readme-transfer/hero.*.b64 | base64 -d > docs/assets/readme/decomproof-hero.png
          cat .readme-transfer/architecture.*.b64 | base64 -d > docs/assets/readme/decomproof-architecture.png
          cat .readme-transfer/flow.*.b64 | base64 -d > docs/assets/readme/decomproof-flow.png

      - name: Verify exact bytes and dimensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct

          expected = {
              Path('docs/assets/readme/decomproof-hero.png'): ('3f02b7c8b76aac3c78555d59fe707fbac222f24c3e8d726bbb733b6afd09b3b3', (2172, 724)),
              Path('docs/assets/readme/decomproof-architecture.png'): ('f0c06ba43cae2cd31ca52bc0a15d85c9fd15dde625792d1cdcfb632f054e95f2', (1672, 941)),
              Path('docs/assets/readme/decomproof-flow.png'): ('3030bb4ede9f6a9dea43755383d0daa5b87972b480bc941a968386a10894cd51', (1672, 941)),
          }
          sig = b'\x89PNG\r\n\x1a\n'
          for path, (want_sha, want_dims) in expected.items():
              data = path.read_bytes()
              assert data[:8] == sig, f'{path}: invalid PNG signature'
              assert data[12:16] == b'IHDR', f'{path}: missing IHDR'
              dims = struct.unpack('>II', data[16:24])
              sha = hashlib.sha256(data).hexdigest()
              assert sha == want_sha, f'{path}: sha256 mismatch {sha}'
              assert dims == want_dims, f'{path}: dimensions {dims} != {want_dims}'
              print(f'OK {path}: {dims[0]}x{dims[1]} sha256={sha}')
          PY

      - name: Update README image placement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('README.md')
          s = p.read_text()

          old_hero = '''<p align="center">\n  <img src="assets/hero.svg" alt="DecomProof: evidence-backed software decommissioning" width="920" />\n</p>'''
          new_hero = '''<p align="center">\n  <img src="docs/assets/readme/decomproof-hero.png" alt="DecomProof — evidence-backed software decommissioning" width="100%" />\n</p>'''
          assert s.count(old_hero) == 1, 'expected exactly one old README hero block'
          s = s.replace(old_hero, new_hero, 1)

          old_flow = '<p align="center"><img src="assets/proof-flow.svg" alt="Evidence-linked proof flow" width="900" /></p>'
          new_flow = '''<p align="center">\n  <img src="docs/assets/readme/decomproof-flow.png" alt="DecomProof retirement proof flow from target selection through post-removal verification" width="100%" />\n</p>'''
          assert s.count(old_flow) == 1, 'expected exactly one old proof-flow image'
          s = s.replace(old_flow, new_flow, 1)

          toc_old = '- [How the proof pipeline works](#how-the-proof-pipeline-works)\n- [Safety model](#safety-model)'
          toc_new = '- [How the proof pipeline works](#how-the-proof-pipeline-works)\n- [Architecture](#architecture)\n- [Safety model](#safety-model)'
          assert s.count(toc_old) == 1, 'expected pipeline/safety TOC anchor'
          s = s.replace(toc_old, toc_new, 1)

          arch_anchor = 'The Rust core owns target identity, evidence normalization, temporal logic, graph construction, policy evaluation, scoring, and proof generation. Network-facing systems are optional shells around that deterministic core.\n\n## Safety model'
          arch_section = '''## Architecture\n\n<p align="center">\n  <img src="docs/assets/readme/decomproof-architecture.png" alt="DecomProof architecture showing interfaces, evidence inputs, deterministic core engine, API/dashboard, and outputs" width="100%" />\n</p>\n\nThe Rust core owns target identity, evidence normalization, temporal logic, graph construction, policy evaluation, scoring, and proof generation. Network-facing systems are optional shells around that deterministic core.\n\nFor the text-based architecture reference and ADRs, see [`docs/architecture`](docs/architecture/).\n\n## Safety model'''
          assert s.count(arch_anchor) == 1, 'expected architecture insertion anchor'
          s = s.replace(arch_anchor, arch_section, 1)

          p.write_text(s)
          PY

      - name: Verify README references and remove obsolete images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s = Path('README.md').read_text()
          required = [
              'docs/assets/readme/decomproof-hero.png',
              'docs/assets/readme/decomproof-architecture.png',
              'docs/assets/readme/decomproof-flow.png',
          ]
          for ref in required:
              assert ref in s, f'missing README reference: {ref}'
              assert Path(ref).is_file(), f'missing asset: {ref}'
          assert 'assets/hero.svg' not in s
          assert 'assets/proof-flow.svg' not in s
          assert 'width="100%"' in s.split('</p>', 1)[0]
          assert s.lstrip().startswith('<p align="center">'), 'hero is not the first README element'
          print('README references verified')
          PY
          git rm -f assets/hero.svg assets/banner.svg assets/proof-flow.svg assets/proof-flow-compact.svg

      - name: Remove transfer files and commit clean content state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .readme-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A README.md docs/assets/readme assets .readme-transfer
          git diff --cached --check
          git status --short
          git commit -m 'docs: use approved README visuals'
          git push origin HEAD:main
