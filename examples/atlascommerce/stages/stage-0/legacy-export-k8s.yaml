apiVersion: apps/v1
kind: Deployment
metadata: {name: legacy-export}
spec:
  replicas: 1
  selector: {matchLabels: {app: legacy-export}}
  template:
    metadata: {labels: {app: legacy-export}}
    spec:
      containers: [{name: legacy-export, image: atlas/legacy-export:1.0}]
---
apiVersion: v1
kind: Service
metadata: {name: legacy-export}
spec: {selector: {app: legacy-export}, ports: [{port: 80, targetPort: 8080}]}
