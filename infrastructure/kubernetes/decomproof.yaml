apiVersion: apps/v1
kind: Deployment
metadata:
  name: decomproof-api
spec:
  replicas: 2
  selector: {matchLabels: {app: decomproof-api}}
  template:
    metadata: {labels: {app: decomproof-api}}
    spec:
      containers:
        - name: api
          image: ghcr.io/psr94/decomproof-api:0.1.0
          ports: [{containerPort: 8000}]
          env:
            - name: DECOMPROOF_DATABASE_URL
              valueFrom: {secretKeyRef: {name: decomproof-db, key: url}}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: decomproof-api}
spec: {selector: {app: decomproof-api}, ports: [{port: 80, targetPort: 8000}]}
